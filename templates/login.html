<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kherwar Admin Login</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef5f2;font-family:system-ui,"Noto Sans Bengali",sans-serif}.box{width:min(380px,calc(100% - 30px));background:#fff;padding:24px;border-radius:20px;box-shadow:0 12px 40px #1232}h1{font-size:20px;margin:0 0 5px;color:#087f5b}p{font-size:12px;color:#65766f}label{display:block;font-size:12px;font-weight:700;margin:12px 0 5px}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #dbe7e2;border-radius:10px}button{width:100%;margin-top:15px;padding:11px;border:0;border-radius:10px;background:#087f5b;color:#fff;font-weight:800}</style></head><body><form class="box" method="post">{% csrf_token %}<h1>☀ Kherwar Calendar</h1><p>Admin Panel Login</p>{% if form.errors %}<p>Username বা password ভুল হয়েছে।</p>{% endif %}<label>Username</label>{{ form.username }}<label>Password</label>{{ form.password }}<input type="hidden" name="next" value="{{ next }}"><button>Login</button></form></body></html>
