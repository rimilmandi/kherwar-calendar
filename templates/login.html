<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Kherwar Calendar</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #087f5b, #0b9b70);
            font-family: system-ui, "Noto Sans Bengali", sans-serif;
        }
        .login-card {
            background: #fff;
            padding: 35px 30px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        .login-card h1 {
            margin: 0 0 8px;
            font-size: 22px;
            color: #087f5b;
            text-align: center;
        }
        .login-card p {
            margin: 0 0 25px;
            font-size: 13px;
            color: #687970;
            text-align: center;
        }
        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #687970;
            margin: 12px 0 6px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #dce8e3;
            border-radius: 10px;
            font: inherit;
            outline: none;
        }
        input:focus {
            border-color: #087f5b;
            box-shadow: 0 0 0 3px rgba(8,127,91,0.1);
        }
        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            background: linear-gradient(135deg, #087f5b, #0b9b70);
            color: #fff;
            border: 0;
            border-radius: 10px;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
        }
        button:hover { opacity: 0.92; }
        .error {
            background: #fdeaea;
            color: #c62828;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
    <form class="login-card" method="POST">
        {% csrf_token %}
        <h1>🔐 Admin Login</h1>
        <p>Kherwar Calendar Control Panel</p>
        
        {% if form.errors %}
            <div class="error">ভুল ইউজারনেম বা পাসওয়ার্ড</div>
        {% endif %}
        
        <label for="id_username">Username</label>
        <input type="text" name="username" id="id_username" autofocus required>
        
        <label for="id_password">Password</label>
        <input type="password" name="password" id="id_password" required>
        
        <button type="submit">লগইন করুন</button>
    </form>
</body>
</html>
